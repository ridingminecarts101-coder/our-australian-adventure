name: iOS compile check

# Manual only. This compiles without signing or contacting App Store Connect.
# No Apple account, certificate or production service secret is needed.
"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Record and verify Xcode
        run: |
          mkdir -p build
          xcodebuild -version | tee build/xcode-version.txt
          xcodebuild -showsdks | tee build/xcode-sdks.txt
          major=$(xcodebuild -version | awk '/^Xcode / {split($2, v, "."); print v[1]}')
          test "$major" -ge 26
          git rev-parse HEAD > build/source-commit.txt
      - name: Install JavaScript and native dependencies
        run: npm ci
      - name: Check JavaScript and stage iOS resources
        run: |
          node --check app.js
          node --check store.js
          npm run stage
          npx cap sync ios
          plutil -lint ios/App/App/Info.plist ios/App/App/PrivacyInfo.xcprivacy
      - name: Compile unsigned iOS Simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/ios-compile.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/ios-compile.log
      - name: Save compilation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-compile-${{ github.run_number }}
          path: |
            build/xcode-version.txt
            build/xcode-sdks.txt
            build/source-commit.txt
            build/ios-compile.log
            build/ios-compile.xcresult
          if-no-files-found: warn
          retention-days: 7
